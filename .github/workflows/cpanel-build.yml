# Builds the cPanel app on Linux (the same OS as the server) after every push to main, and publishes it to the
# `cpanel` branch, so the server updates with `bash update.sh` (git pull + install if needed + restart).
# Code only: no .env and no secrets/ — those exist only on the server and are git-ignored there.
# The same build is also attached to each run as the talkie-cpanel artifact. See docs/DEPLOY.md → "cPanel".
name: cPanel build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cpanel-build
  cancel-in-progress: true

permissions:
  contents: write # publishes the build to the cpanel branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck -w @talkie/web

      - name: Unit tests
        run: npm test

      - name: Build the cPanel bundle (code only)
        run: node scripts/build-cpanel.mjs --code-only --no-zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: talkie-cpanel
          path: build/cpanel
          retention-days: 14
          if-no-files-found: error

      - name: Publish to the cpanel branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" cpanel >/dev/null; then
            git clone --quiet --depth 1 --branch cpanel "$remote" deploy
          else
            git init --quiet -b cpanel deploy
            git -C deploy remote add origin "$remote"
          fi
          cd deploy
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a ../build/cpanel/. .
          chmod +x update.sh
          {
            echo '# Only on the server, never in git. Anchored to this folder: web/node_modules (the web app’s own packages) is part of the build.'
            echo '/.env'
            echo '/secrets/'
            echo '/node_modules/'
            echo '/data/'
            echo '/tmp/'
            echo '/*.log'
            echo '/*.log.1'
          } > .gitignore
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "Build of ${GITHUB_SHA::7}"
          git push --quiet origin cpanel
          echo "Published $(git rev-parse --short HEAD) to the cpanel branch."
