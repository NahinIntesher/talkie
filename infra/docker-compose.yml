# Production stack for one VPS (see docs/DEPLOY.md). Scale a service with: docker compose up -d --scale chat=3
# Nginx resolves each service name to all of its replicas and load-balances between them (least_conn).
# Calls and meetings use LiveKit Cloud (LIVEKIT_* in .env), so no media server runs here.
name: talkie

x-service: &service
  restart: unless-stopped
  env_file: ../.env
  environment: &service-env
    NODE_ENV: production
    HOST: 0.0.0.0
    # A hosted database (cPanel) when DB_HOST is set in .env; otherwise the bundled MySQL container (profile localdb).
    DB_HOST: ${DB_HOST:-mysql}
    DB_USER: ${DB_USER:-talkie}
    DB_PASSWORD_FILE: /run/secrets/mysql_password
    # Each replica takes a distinct Snowflake worker id from its container address.
    WORKER_ID: auto
    REDIS_URL: redis://redis:6379
    BUS_DRIVER: redis
    JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
    USERS_URL: http://users:4102
    NOTIFY_URL: http://notify:4107
    AUTH_URL: http://auth:4101
    CHAT_URL: http://chat:4103
    MEDIA_URL: http://media:4105
    MEET_URL: http://meet:4106
  secrets: [jwt_public, mysql_password]
  depends_on:
    mysql: { condition: service_healthy, required: false }
    redis: { condition: service_healthy }
  networks: [backend]
  logging: { driver: json-file, options: { max-size: 20m, max-file: '5' } }

services:
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/talkie.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on: [web, auth, users, notify, chat, realtime, media, meet, admin]
    networks: [backend]

  web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    image: talkie/web
    restart: unless-stopped
    environment: { NODE_ENV: production }
    networks: [backend]

  auth:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: auth } }
    image: talkie/auth
    environment: { <<: *service-env, PORT: 4101, JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private }
    secrets: [jwt_public, jwt_private, mysql_password]

  users:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: users } }
    image: talkie/users
    environment: { <<: *service-env, PORT: 4102 }

  notify:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: notify } }
    image: talkie/notify
    environment: { <<: *service-env, PORT: 4107 }

  chat:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: chat } }
    image: talkie/chat
    environment: { <<: *service-env, PORT: 4103 }

  realtime:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: realtime } }
    image: talkie/realtime
    environment: { <<: *service-env, PORT: 4104 }

  media:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: media } }
    image: talkie/media
    environment: { <<: *service-env, PORT: 4105, STORAGE_DIR: /data/media }
    # With STORAGE_DRIVER=disk keep one replica (or shared storage); with s3 it scales freely.
    volumes: [media-data:/data/media]

  meet:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: meet } }
    image: talkie/meet
    environment: { <<: *service-env, PORT: 4106 }

  admin:
    <<: *service
    build: { context: .., dockerfile: infra/docker/service.Dockerfile, args: { SERVICE: admin } }
    image: talkie/admin
    environment: { <<: *service-env, PORT: 4108 }

  # Applies database migrations, then exits: docker compose run --rm migrate
  migrate:
    build: { context: .., dockerfile: infra/docker/migrate.Dockerfile }
    image: talkie/migrate
    profiles: [tools]
    env_file: ../.env
    environment: { NODE_ENV: production, DB_HOST: '${DB_HOST:-mysql}', DB_USER: '${DB_USER:-talkie}', DB_PASSWORD_FILE: /run/secrets/mysql_password }
    secrets: [mysql_password]
    depends_on: { mysql: { condition: service_healthy, required: false } }
    networks: [backend]

  mysql:
    image: mysql:8.4
    profiles: [localdb]
    restart: unless-stopped
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci', '--default-time-zone=+00:00', '--innodb-buffer-pool-size=1G', '--max-connections=400']
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root
      # The services' own account; infra/mysql/init grants it the talkie_* databases only.
      MYSQL_USER: talkie
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    secrets: [mysql_root, mysql_password]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck: { test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1'], interval: 10s, timeout: 5s, retries: 10 }
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '512mb', '--maxmemory-policy', 'noeviction']
    volumes: [redis-data:/data]
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 10s, timeout: 3s, retries: 10 }
    networks: [backend]

  certbot:
    image: certbot/certbot:latest
    profiles: [tools]
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

secrets:
  jwt_public: { file: ../secrets/jwt-public.pem }
  jwt_private: { file: ../secrets/jwt-private.pem }
  mysql_root: { file: ../secrets/mysql-root.txt }
  mysql_password: { file: ../secrets/mysql-password.txt }

volumes:
  media-data:
  mysql-data:
  redis-data:
  certbot-www:

networks:
  backend:
