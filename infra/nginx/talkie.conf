# Upstreams: `resolve` keeps the replica list current as services are scaled (nginx 1.27.3+).
upstream web_upstream      { zone web 64k;      least_conn; server web:3000 resolve;      keepalive 32; }
upstream auth_upstream     { zone auth 64k;     least_conn; server auth:4101 resolve;     keepalive 32; }
upstream users_upstream    { zone users 64k;    least_conn; server users:4102 resolve;    keepalive 32; }
upstream notify_upstream   { zone notify 64k;   least_conn; server notify:4107 resolve;   keepalive 16; }
upstream chat_upstream     { zone chat 64k;     least_conn; server chat:4103 resolve;     keepalive 32; }
upstream realtime_upstream { zone realtime 64k; least_conn; server realtime:4104 resolve; }
upstream media_upstream    { zone media 64k;    least_conn; server media:4105 resolve;    keepalive 16; }
upstream meet_upstream     { zone meet 64k;     least_conn; server meet:4106 resolve;     keepalive 16; }
upstream admin_upstream    { zone admin 64k;    least_conn; server admin:4108 resolve;    keepalive 8; }

server {
  listen 80;
  server_name talkie.kodofact.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name talkie.kodofact.com;

  ssl_certificate     /etc/letsencrypt/live/talkie.kodofact.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/talkie.kodofact.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:20m;
  ssl_session_timeout 1d;
  ssl_stapling on;
  ssl_stapling_verify on;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(self)" always;
  add_header X-Frame-Options DENY always;

  limit_conn conn 100;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;
  proxy_next_upstream error timeout http_502 http_503;
  proxy_next_upstream_tries 2;
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;

  # Service-to-service routes are never reachable from the internet.
  location ~ ^/api/[^/]+/internal { return 404; }
  location /internal { return 404; }

  location /api/auth/   { limit_req zone=auth burst=20 nodelay; proxy_pass http://auth_upstream/auth/; }
  location /api/users/  { limit_req zone=api burst=60 nodelay;  proxy_pass http://users_upstream/users/; }
  location /api/notify/ { limit_req zone=api burst=20 nodelay;  proxy_pass http://notify_upstream/notify/; }

  # A group message carries one sealed key per member device, so chat accepts larger bodies.
  location /api/chat/  { limit_req zone=api burst=100 nodelay; client_max_body_size 4m; proxy_pass http://chat_upstream/chat/; }

  # WebSockets: Socket.IO keeps its path (/ws); realtime replicas share rooms through Redis, so no sticky sessions.
  location /ws {
    proxy_pass http://realtime_upstream;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Media: 8 MB upload parts streamed straight through; downloads stream with range support.
  location /api/media/ {
    client_max_body_size 9m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://media_upstream/media/;
  }

  # Calls and meetings (signalling only: audio and video go straight to LiveKit). LiveKit webhooks arrive here too.
  location /api/meet/  { limit_req zone=api burst=60 nodelay;  proxy_pass http://meet_upstream/meet/; }

  # Admin panel API (staff only; every request re-checks the caller's current role).
  location /api/admin/ { limit_req zone=api burst=30 nodelay;  proxy_pass http://admin_upstream/admin/; }

  location /_next/static/ {
    proxy_pass http://web_upstream;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://web_upstream;
  }
}
