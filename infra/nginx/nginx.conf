user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  client_max_body_size 2m;

  log_format main escape=json '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time",'
    '"upstream":"$upstream_addr","rid":"$request_id","ua":"$http_user_agent"}';
  access_log /var/log/nginx/access.log main buffer=32k flush=5s;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Docker's DNS: service names resolve to every replica; re-resolved every 10 seconds.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Rate limits (per client IP) on top of each service's own per-user limits.
  limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  include /etc/nginx/conf.d/*.conf;
}
